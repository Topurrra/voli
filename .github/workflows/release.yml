name: Release

# Fires when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      # `voli self-update` compares env!("CARGO_PKG_VERSION") of the installed
      # binary against the release tag_name. If the tag and Cargo.toml disagree,
      # every user gets an update that never stops re-offering itself (or a
      # bogus "local version is newer than latest release"). Fail here instead.
      - name: Verify version consistency
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $expected = $env:TAG -replace '^v', ''
          $cargo = Get-Content Cargo.toml -Raw
          $readme = Get-Content README.md -Raw

          $checks = [ordered]@{
            'Cargo.toml [workspace.package] version' = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
            'Cargo.toml voli-core path-dep version'  = [regex]::Match($cargo, '(?m)^voli-core\s*=.*?version\s*=\s*"([^"]+)"').Groups[1].Value
            'Cargo.toml stela path-dep version'      = [regex]::Match($cargo, '(?m)^stela\s*=.*?version\s*=\s*"([^"]+)"').Groups[1].Value
            'README.md status line'                  = [regex]::Match($readme, '\*\*Status:\s*v([^,\*]+),').Groups[1].Value
          }

          $bad = $false
          foreach ($name in $checks.Keys) {
            $found = $checks[$name]
            if ($found -ne $expected) {
              Write-Output "::error::$name is '$found' but tag v$expected requires '$expected'"
              $bad = $true
            }
          }
          if ($bad) {
            Write-Output "Refusing to release: bump every version reference to $expected and retag."
            exit 1
          }
          Write-Output "All version references agree: $expected"

      # Same gates as ci.yml — a tag can be pushed at a commit CI never saw, so
      # re-run them here rather than trusting that it was green somewhere.
      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Gate the release on a green test suite — never ship a broken build.
      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc

      - name: Package
        id: package
        shell: pwsh
        # Passed through env, not ${{ }} interpolation: a crafted tag name would
        # otherwise be pasted straight into this script body.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $bin = "target/x86_64-pc-windows-msvc/release"
          $staging = "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "$bin/voli.exe","$bin/voli-shim.exe","$bin/voli-shim-gui.exe" $staging
          Copy-Item "license/LICENSE-MIT","license/LICENSE-APACHE" $staging

          $versioned = "voli-$version-x64.zip"
          $stable    = "voli-x64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $versioned -Force
          Copy-Item $versioned $stable -Force

          foreach ($z in @($versioned, $stable)) {
            (Get-FileHash $z -Algorithm SHA256).Hash.ToLower() | Set-Content "$z.sha256" -NoNewline
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            voli-${{ steps.package.outputs.version }}-x64.zip
            voli-${{ steps.package.outputs.version }}-x64.zip.sha256
            voli-x64.zip
            voli-x64.zip.sha256
            install.ps1

  # arm64 is out of scope for v0.1. To enable: add the target and a matching
  # package/upload step. Cross-compiling only needs the target added to the
  # toolchain — the msvc linker on windows-latest handles aarch64. See docs/
  # Voli.md §4 for the per-arch `extract_dir` schema gap to fix first.
  #
  # release-arm64:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
  #       with:
  #         toolchain: stable
  #         targets: aarch64-pc-windows-msvc
  #     - name: Build
  #       run: cargo build --release --workspace --target aarch64-pc-windows-msvc
  #     - name: Package
  #       shell: pwsh
  #       env:
  #         TAG: ${{ github.ref_name }}
  #       run: |
  #         $version = $env:TAG -replace '^v', ''
  #         # ... same packaging as x64, producing voli-$version-arm64.zip
  #     # ... upload as additional assets on the same release
