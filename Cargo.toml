[workspace]
resolver = "2"
members = ["crates/voli", "crates/voli-core", "crates/voli-shim", "crates/voli-index-tool"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Topurrra/voli"
authors = ["Nika Topuria"]

[workspace.dependencies]
voli-core = { path = "crates/voli-core", version = "0.5.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
junction = "1"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
zstd = "0.13"
ed25519-dalek = "2"
hex = "0.4"
getrandom = "0.3"
strsim = "0.11"
sevenz-rust2 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winresource = "0.1"
indicatif = "0.17"
anyhow = "1"
tiny_http = "0.12"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Foundation",
] }
