[workspace]
resolver = "2"
members = ["crates/voli", "crates/voli-core", "crates/voli-shim", "crates/voli-index-tool", "crates/stela"]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Topurrra/voli"
authors = ["Nika Topuria"]

[workspace.dependencies]
voli-core = { path = "crates/voli-core", version = "0.8.2" }
stela = { path = "crates/stela", version = "0.8.2" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
toml = "0.8"
regex = "1"
roxmltree = "0.20"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
junction = "1"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
zstd = "0.13"
ed25519-dalek = "2"
hex = "0.4"
getrandom = "0.3"
strsim = "0.11"
sevenz-rust2 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winresource = "0.1"
indicatif = "0.17"
anyhow = "1"
tiny_http = "0.12"
winreg = "0.52"
# stela (voli memory) — encrypted agent-memory engine.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = "0.5"
blake2 = "0.10"
zeroize = "1"
keyring = "3"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
] }
