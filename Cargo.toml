[workspace]
resolver = "2"
members = ["crates/voli", "crates/voli-core", "crates/voli-shim", "crates/voli-index-tool", "crates/stela"]

[workspace.package]
version = "0.13.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Topurrra/voli"
authors = ["Nika Topuria"]

[workspace.dependencies]
voli-core = { path = "crates/voli-core", version = "0.13.2" }
stela = { path = "crates/stela", version = "0.13.2" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
toml = "0.8"
regex = "1"
roxmltree = "0.20"
sha2 = "0.10"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
junction = "1"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
zstd = "0.13"
ed25519-dalek = "2"
hex = "0.4"
getrandom = "0.3"
strsim = "0.11"
sevenz-rust2 = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winresource = "0.1"
indicatif = "0.17"
anyhow = "1"
# voli graph — tree-sitter AST extraction (single 0.24 runtime; exact pins:
# newer grammar releases moved to incompatible 0.25/0.26 runtimes and cargo
# cannot link two `tree-sitter` natives into one binary). Outliers without a
# 0.24 release (swift, kotlin, hcl, vue, ...) use the regex fallback in
# voli-core/src/graph_fallback.rs.
tree-sitter = "0.24"
streaming-iterator = "0.1"
tree-sitter-rust = "=0.23.3"
tree-sitter-python = "=0.23.6"
tree-sitter-javascript = "=0.23.1"
tree-sitter-go = "=0.23.4"
tree-sitter-c = "=0.23.4"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-bash = "=0.23.3"
tree-sitter-php = "=0.23.11"
tree-sitter-css = "=0.23.2"
tree-sitter-yaml = "=0.7.0"
tree-sitter-powershell = "=0.24.5"
tree-sitter-typescript = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-json = "=0.24.8"
tree-sitter-html = "=0.23.2"
tree-sitter-julia = "=0.23.1"
tree-sitter-groovy = "=0.1.2"
tree-sitter-pascal = "=0.10.2"
tree-sitter-verilog = "=1.0.3"
tree-sitter-zig = "=1.1.2"
tree-sitter-fortran = "=0.5.1"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-objc = "=3.0.2"
tree-sitter-xml = "=0.7.0"
tree-sitter-scala = "=0.24.1"
tiny_http = "0.12"
winreg = "0.52"
# stela (voli memory) — encrypted agent-memory engine.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
argon2 = "0.5"
blake2 = "0.10"
zeroize = "1"
keyring = "3"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    # Native host arch, which cfg!(target_arch) cannot report from an emulated
    # x64 process on an ARM64 box. IsWow64Process2 is resolved at runtime via
    # GetProcAddress (LibraryLoader) rather than imported, so the binary still
    # loads on Windows older than 10 1709; Threading is GetCurrentProcess and
    # SystemInformation is IMAGE_FILE_MACHINE_*.
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
