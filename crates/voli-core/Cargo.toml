[package]
name = "voli-core"
version.workspace = true
edition.workspace = true
description = "Core library for voli, the fast no-admin package manager for Windows"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
rusqlite = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }
zstd = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
strsim = { workspace = true }
sevenz-rust2 = { workspace = true }

# Windows-only: install engine (junctions), user env (registry), self-install.
# Gated so cross-platform consumers (voli-index-tool on CI runners) can build.
[target.'cfg(windows)'.dependencies]
junction = { workspace = true }
winreg = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
sevenz-rust2 = { workspace = true }
tiny_http = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
junction = { workspace = true }
