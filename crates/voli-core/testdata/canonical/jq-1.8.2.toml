name = "jq"
version = "1.8.2"
description = "Lightweight and flexible command-line JSON processor."
homepage = "https://jqlang.org/"
license = "MIT"
kind = "app"
file_name = "jq.exe"
bin = ["jq.exe"]

[source.x64]
url = "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe"
sha256 = "a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627"
kind = "binary"

[source.arm64]
url = "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-arm64.exe"
sha256 = "083b5377392bc57cf27052b6d20a2d927770683bca844632901ff38b4b7b0ac7"
kind = "binary"

# jq tags releases "jq-<version>", and github checkver only strips a leading "v"
# (voli-index-tool github_version), so it would resolve the version as
# "jq-1.8.2". Read the tag out of the releases feed instead.
[autoupdate]
checkver = { url = "https://github.com/jqlang/jq/releases.atom", regex = "Repository/\\d+/jq-([\\d.]+)<" }
url_template = { x64 = "https://github.com/jqlang/jq/releases/download/jq-$version/jq-windows-amd64.exe", arm64 = "https://github.com/jqlang/jq/releases/download/jq-$version/jq-windows-arm64.exe" }
