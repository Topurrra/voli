# voli static site. Serves docs-site/ inside the container on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # GitHub-Pages-style clean URLs: /docs serves docs.html, /changelog serves
    # changelog.html, so links keep working the same way they did on Pages.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The PowerShell install one-liner (iwr volibear.dev/install | iex) needs the
    # raw script as text, not an octet-stream download.
    location = /install {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Same for the unix one-liner (curl -fsSL volibear.dev/install.sh | sh).
    # curl does not care about the type, but nginx has no mime mapping for .sh,
    # so without this a browser downloads the script instead of showing it --
    # and the note on the landing page asks people to read it first.
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # Static assets revalidate via ETag/Last-Modified (no hard expiry), so a
    # rebuilt image never serves stale JS or CSS.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/woff2;
}
